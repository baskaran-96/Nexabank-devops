name: Orchestrate Multiple micro service

on:
  push:
    branches: [ main ]  # Triggers when you change code in this main repo
  workflow_dispatch:     # Adds a manual "Run" button to your Actions tab

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone this current repo
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # Step 2: Pull in your second repo
      - name: Checkout Second Repo
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/YOUR_SECOND_REPO_NAME'
          path: 'second-project' # Downloads into a folder named 'second-project'

      # Step 3: Run code across your files
      - name: Run tasks
        run: |
          echo "Current files in main repo:"
          ls -la
          
          echo "Files inside second repo:"
          ls -la second-project
